name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.label }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # « apk » : versions fournies par Chaquopy dans l'APK Android (Python 3.10)
          - python: "3.10"
            label: apk
            apk: true
          # « recent » : dernières versions. Python 3.15 non ajouté : pas encore disponible sur les runners.
          - python: "3.13"
            label: recent
            apk: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Versions de l'APK (numpy, scipy, matplotlib)
        if: matrix.apk
        run: pip install "numpy==1.23.*" "scipy==1.8.1" "matplotlib==3.6.*"
      - name: Installation du projet et de pytest
        run: pip install -e . pytest
      - name: Tests
        run: pytest -q
